buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.boox.quicksettings'
    compileSdk 33

    defaultConfig {
        applicationId "com.boox.quicksettings"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
}
